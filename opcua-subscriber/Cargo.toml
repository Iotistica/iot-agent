[package]
name = "opcua-subscriber"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "2"
opcua = { version = "0.12", features = ["client"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = "0.4"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
