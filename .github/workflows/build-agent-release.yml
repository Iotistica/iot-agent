name: Agent Release

# Push a version tag to build, package, and release the agent in one shot.
# Requires successful CI for the exact tagged commit before any build or publish.
#
#   git tag v1.0.531 && git push origin v1.0.531
#
# Manual re-run (e.g. to rebuild an existing version):
#   GitHub Actions → Agent Release → Run workflow → enter version.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (e.g. 1.0.531)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: agent-release-publish
  cancel-in-progress: false

jobs:

  # ── Extract version ──────────────────────────────────────────────────────────
  version:
    name: Extract Version
    runs-on: [ubuntu-24.04]
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag:     ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"  >> $GITHUB_OUTPUT
          echo "Releasing v${VERSION}"

  # ── Verify tagged source and its CI run ─────────────────────────────────────
  verify_ci:
    name: Verify tagged commit passed CI
    needs: version
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      promote_latest: ${{ steps.verify.outputs.promote_latest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_WORKFLOW: ${{ vars.RELEASE_CI_WORKFLOW_FILE }}
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout tags and release branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release source and CI
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CI_WORKFLOW" ]; then
            # Discover the CI workflow by its exact declared name, not a guessed filename.
            WORKFLOWS=$(gh api --paginate "repos/${GH_REPO}/actions/workflows?per_page=100" --jq '.workflows[] | select(.name == "CI Build, Test & Push Agent" and .state == "active") | .id')
            COUNT=$(printf '%s\n' "$WORKFLOWS" | sed '/^$/d' | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "Expected exactly one active workflow named 'CI Build, Test & Push Agent'; found $COUNT. Set RELEASE_CI_WORKFLOW_FILE to its filename." >&2
              exit 1
            fi
            CI_WORKFLOW="$WORKFLOWS"
          fi
          git fetch --force origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" 'refs/tags/*:refs/tags/*'
          SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          MAIN_SHA=$(git rev-parse --verify "refs/remotes/origin/${RELEASE_BRANCH}^{commit}")
          PROMOTE=false
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            if [ "$SHA" != "$MAIN_SHA" ]; then
              echo "New release tag must point to current ${RELEASE_BRANCH} HEAD: tag=$SHA branch=$MAIN_SHA" >&2
              exit 1
            fi
            PROMOTE=true
          fi
          # Find CI runs for this exact SHA; never accept a run for another commit.
          # The most recent matching push run must have completed successfully.
          RUNS=$(gh api --method GET "repos/${GH_REPO}/actions/workflows/${CI_WORKFLOW}/runs" \
            -f head_sha="$SHA" -f per_page=100 -f event=push)
          MATCH=$(jq -c --arg sha "$SHA" --arg branch "$RELEASE_BRANCH" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .event == "push")] | sort_by(.created_at, .id) | last // empty' <<< "$RUNS")
          if [ -z "$MATCH" ]; then
            echo "No CI push run found for tag ${RELEASE_TAG}, SHA ${SHA} on ${RELEASE_BRANCH}" >&2
            exit 1
          fi
          STATUS=$(jq -r '.status' <<< "$MATCH")
          CONCLUSION=$(jq -r '.conclusion // "none"' <<< "$MATCH")
          RUN_URL=$(jq -r '.html_url' <<< "$MATCH")
          if [ "$STATUS" != 'completed' ] || [ "$CONCLUSION" != 'success' ]; then
            echo "CI is not successful for $SHA: status=$STATUS conclusion=$CONCLUSION ($RUN_URL)" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "promote_latest=$PROMOTE" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified release source"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$SHA\`"
            echo "- CI: $RUN_URL (success)"
            echo "- Promote latest: $PROMOTE"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Build tarball + .deb (matrix: x86_64 / arm64) ───────────────────────────
  package:
    name: Build & Package (${{ matrix.arch }})
    needs: [version, verify_ci]
    runs-on: [ubuntu-24.04]
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
          - arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify_ci.outputs.sha }}

      - name: Stamp root package.json version
        run: |
          set -euo pipefail
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          node -p "require('./package.json').version"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Cache npm download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-${{ matrix.arch }}-

      - name: Install agent dependencies
        run: npm ci --legacy-peer-deps

      - name: Build agent (TypeScript)
        run: npm run build

      - name: Set up QEMU (ARM64 cross-compile)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/arm64

      - name: Rebuild native modules for ARM64
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            --platform linux/arm64 \
            node:24-slim bash -c "
              apt-get update -qq && apt-get install -y -qq build-essential python3
              npm rebuild node-pty @serialport/bindings-cpp
            "

      - name: Build Admin UI
        working-directory: ./admin
        run: npm ci --legacy-peer-deps && npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Bundle CLI install script
        run: cp cli/bin/cli-install.sh bin/cli-install.sh

      - name: Build tarball
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p /tmp/artifacts

          tar -czf /tmp/artifacts/agent-${VERSION}-${ARCH}.tar.gz \
            -C "${{ github.workspace }}" \
            dist/ package.json package-lock.json node_modules/ bin/ admin/dist/

          cd /tmp/artifacts
          sha256sum agent-${VERSION}-${ARCH}.tar.gz > agent-${VERSION}-${ARCH}.tar.gz.sha256
          echo "✓ agent-${VERSION}-${ARCH}.tar.gz"

      - name: Stamp install.sh (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          BUILD_ID="${GITHUB_SHA::7}-$(date -u +%Y%m%d)"
          sed -e "s/AGENT_VERSION_PLACEHOLDER/${VERSION}/g" -e "s/BUILD_ID_PLACEHOLDER/${BUILD_ID}/g" bin/install.sh > /tmp/artifacts/install.sh
          chmod +x /tmp/artifacts/install.sh
          cd /tmp/artifacts
          sha256sum install.sh > install.sh.sha256

      - name: Build .deb package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh \
            "/tmp/artifacts/agent-${VERSION}-${{ matrix.arch }}.tar.gz" \
            "$VERSION" \
            "${{ matrix.deb_arch }}"
          echo "✓ iotistica-agent_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Azure login
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to Azure
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          DEB_ARCH="${{ matrix.deb_arch }}"
          ACCT=${{ secrets.AZURE_STORAGE_ACCOUNT }}
          DEB="iotistica-agent_${VERSION}_${DEB_ARCH}.deb"

          # Tarball — versioned permanent + rolling latest
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/versions/agent-${VERSION}-${ARCH}.tar.gz" \
            --file "/tmp/artifacts/agent-${VERSION}-${ARCH}.tar.gz" \
            --overwrite true --auth-mode key --only-show-errors --output none --content-type application/gzip
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/versions/agent-${VERSION}-${ARCH}.tar.gz.sha256" \
            --file "/tmp/artifacts/agent-${VERSION}-${ARCH}.tar.gz.sha256" \
            --overwrite true --auth-mode key --only-show-errors --output none --content-type text/plain
          if [ "${{ needs.verify_ci.outputs.promote_latest }}" = "true" ]; then
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/agent-latest-${ARCH}.tar.gz" \
            --file "/tmp/artifacts/agent-${VERSION}-${ARCH}.tar.gz" \
            --overwrite true --auth-mode key --only-show-errors --output none --content-type application/gzip
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/agent-latest-${ARCH}.tar.gz.sha256" \
            --file "/tmp/artifacts/agent-${VERSION}-${ARCH}.tar.gz.sha256" \
            --overwrite true --auth-mode key --only-show-errors --output none --content-type text/plain

          fi

          # .deb — versioned + rolling latest
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/versions/${DEB}" \
            --file "/tmp/artifacts/${DEB}" \
            --overwrite true --auth-mode key --only-show-errors --output none \
            --content-type "application/vnd.debian.binary-package"
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/versions/${DEB}.sha256" \
            --file "/tmp/artifacts/${DEB}.sha256" \
            --overwrite true --auth-mode key --only-show-errors --output none --content-type text/plain
          if [ "${{ needs.verify_ci.outputs.promote_latest }}" = "true" ]; then
          az storage blob upload --account-name "$ACCT" --container-name scripts \
            --name "agent/iotistica-agent-latest-${DEB_ARCH}.deb" \
            --file "/tmp/artifacts/${DEB}" \
            --overwrite true --auth-mode key --only-show-errors --output none \
            --content-type "application/vnd.debian.binary-package"

          fi

          # x86_64-only: generic latest tarball, install.sh, versioned install snapshot
          if [ "$ARCH" = "x86_64" ]; then
            if [ "${{ needs.verify_ci.outputs.promote_latest }}" = "true" ]; then
            az storage blob upload --account-name "$ACCT" --container-name scripts \
              --name "agent/agent-latest.tar.gz" \
              --file "/tmp/artifacts/agent-${VERSION}-x86_64.tar.gz" \
              --overwrite true --auth-mode key --only-show-errors --output none --content-type application/gzip
            az storage blob upload --account-name "$ACCT" --container-name scripts \
              --name "agent/install.sh" \
              --file "/tmp/artifacts/install.sh" \
              --overwrite true --auth-mode key --only-show-errors --output none --content-type text/x-shellscript
            az storage blob upload --account-name "$ACCT" --container-name scripts \
              --name "agent/install.sh.sha256" \
              --file "/tmp/artifacts/install.sh.sha256" \
              --overwrite true --auth-mode key --only-show-errors --output none --content-type text/plain
            fi
            az storage blob upload --account-name "$ACCT" --container-name scripts \
              --name "agent/versions/install-${VERSION}.sh" \
              --file "/tmp/artifacts/install.sh" \
              --overwrite true --auth-mode key --only-show-errors --output none --content-type text/x-shellscript
          fi

      - name: Save artifacts for publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ matrix.arch }}
          path: /tmp/artifacts/
          retention-days: 1

  # ── Docker: build + push with version tag ───────────────────────────────────
  docker:
    name: Docker Build & Push
    needs: [version, verify_ci]
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify_ci.outputs.sha }}

      - name: Stamp root package.json version
        run: |
          set -euo pipefail
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          node -p "require('./package.json').version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set cache-bust date and build ID
        id: cachebust
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "build_id=${GITHUB_SHA::7}-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            iotistic/agent:${{ needs.version.outputs.version }}
            ${{ needs.verify_ci.outputs.promote_latest == 'true' && 'iotistic/agent:latest' || '' }}
          cache-from: type=registry,ref=iotistic/agent:buildcache
          cache-to: type=registry,ref=iotistic/agent:buildcache,mode=min,ignore-error=true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            APK_CACHE_BUST=${{ steps.cachebust.outputs.date }}
            BUILD_ID=${{ steps.cachebust.outputs.build_id }}

  # ── Deploy to Azure Container App (disabled — container app removed) ───────
