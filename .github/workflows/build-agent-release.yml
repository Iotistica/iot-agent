  #       run: |
  #         az containerapp update \
  #           --name "$CONTAINER_APP" \
  #           --resource-group "$RESOURCE_GROUP" \
  #           --image "iotistic/agent:${{ needs.version.outputs.version }}" \
  #           --set-env-vars \
  #             NODE_ENV=production \
  #             STANDALONE=true \
  #             API_SECURITY_MODE=OPEN \
  #             FIREWALL_MODE=disabled \
  #             PRO_FORCE=false \
  #             USE_MSGPACK_POC=false \
  #             USE_KEY_COMPACTION_POC=false \
  #             USE_DEFLATE_COMPRESSION=false \
  #             AGENT_SHELL_MAX_SESSION_MS=3600000 \
  #             LOG_LEVEL=info
