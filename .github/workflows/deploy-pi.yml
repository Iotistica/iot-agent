
name: Deploy to Test Pi

on:
  workflow_run:
    workflows: ["Agent Release", "CI Build, Test & Push Agent"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  PLINK: C:\Program Files\PuTTY\plink.exe
  PLINK_ARGS: '-batch -hostkey "${{ secrets.PI_SSH_HOST_KEY }}"'

jobs:
  deploy:
    name: Deploy Agent to Test Pi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]

    steps:
      - name: Deploy via SSH (Docker + Mosquitto)
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "set -e; curl -fsSL https://get.iotistica.com/agent/builds/latest/install.sh -o /tmp/iotistica-install.sh && sudo -n env IOTISTICA_INSTALL_DOCKER=yes IOTISTICA_INSTALL_MOSQUITTO=yes IOTISTICA_DOWNLOAD_BASE_URL=https://get.iotistica.com/agent/builds/latest sh /tmp/iotistica-install.sh"

      - name: Verify agent version
        shell: cmd
        run: >
          echo Triggering commit: ${{ github.event.workflow_run.head_sha || github.sha }}
          && "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "sleep 5 && echo Deployed version: $(grep -m1 version /opt/iotistic/agent/package.json | tr -d ' ,') && echo Deployed build: $(sudo -n grep -m1 '^BUILD_ID=' /etc/iotistic/agent.env | cut -d= -f2)"

      - name: Verify Mosquitto service
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "sudo -n systemctl is-active --quiet mosquitto && echo Mosquitto is running"

      - name: Show license status and logs
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "echo '--- License status ---'; sudo -n iotctl license; echo '--- License journal (last 10 minutes) ---'; sudo -n journalctl -u iotistica-agent --since '10 minutes ago' --no-pager | grep -i license || echo 'No licensing journal entries found'"
