
name: Deploy to Test Pi

on:
  workflow_run:
    workflows: ["Agent Release", "CI Build, Test & Push Agent"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  PLINK: C:\Program Files\PuTTY\plink.exe
  PLINK_ARGS: '-batch -hostkey "${{ secrets.PI_SSH_HOST_KEY }}"'

jobs:
  deploy:
    name: Deploy Agent to Test Pi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]

    steps:
      - name: Install agent, updater, Docker and Mosquitto
        shell: cmd
        run: >
          echo Starting agent installation on the test Pi...
          &&
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "set -e; echo '[install] Downloading installer'; curl -fsSL https://get.iotistica.com/agent/builds/latest/install.sh -o /tmp/iotistica-install.sh; echo '[install] Installing agent and root-owned update service'; sudo -n env IOTISTICA_INSTALL_DOCKER=yes IOTISTICA_INSTALL_MOSQUITTO=yes IOTISTICA_DOWNLOAD_BASE_URL=https://get.iotistica.com/agent/builds/latest sh /tmp/iotistica-install.sh; echo '[install] Agent and updater installation completed'"

      - name: Verify root-owned updater service
        shell: cmd
        run: >
          echo Verifying updater installation on the test Pi...
          &&
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "set -e; if [ ! -x /usr/local/sbin/update-runner.sh ] || [ ! -x /usr/local/bin/update.sh ]; then echo '[error] Update runner or update script is missing'; exit 1; fi; if ! systemctl is-enabled --quiet update.path || ! systemctl is-active --quiet update.path; then echo '[error] Update watcher is not enabled and active'; systemctl status update.path --no-pager || true; exit 1; fi; if ! systemctl show update.service --property=User | grep -qx User=root; then echo '[error] Update service is not configured to run as root'; exit 1; fi; echo '[ok] Root-owned updater is installed and watching for requests'"

      - name: Verify agent version
        shell: cmd
        run: >
          echo Triggering commit: ${{ github.event.workflow_run.head_sha || github.sha }}
          && "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "sleep 5 && echo Deployed version: $(grep -m1 version /opt/iotistic/agent/package.json | tr -d ' ,') && echo Deployed build: $(sudo -n grep -m1 '^BUILD_ID=' /etc/iotistic/agent.env | cut -d= -f2)"

      - name: Verify Mosquitto service
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "sudo -n systemctl is-active --quiet mosquitto && echo Mosquitto is running"

      - name: Show license status and logs
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "echo '--- License status ---'; sudo -n iotctl license; echo '--- License journal (last 10 minutes) ---'; sudo -n journalctl -u iotistica-agent --since '10 minutes ago' --no-pager | grep -i license || echo 'No licensing journal entries found'"
