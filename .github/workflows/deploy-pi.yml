name: Deploy to Test Pi

on:
  workflow_run:
    workflows: ["Agent Release", "CI Build, Test & Push Agent"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  PLINK: C:\Program Files\PuTTY\plink.exe
  PLINK_ARGS: '-batch -hostkey "ssh-ed25519 256 SHA256:maHVl64ml0JUPrqRJYBOgp5cqAkvwmpDjBS28StNP/o"'

jobs:
  deploy:
    name: Deploy Agent to Test Pi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted]

    steps:
      - name: Deploy via SSH
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "curl -sfL https://get.iotistica.com/agent/builds/latest/install.sh | sudo IOTISTICA_DOWNLOAD_BASE_URL=https://get.iotistica.com/agent/builds/latest sh"

      - name: Verify agent version
        shell: cmd
        run: >
          echo Triggering commit: ${{ github.event.workflow_run.head_sha || github.sha }}
          && "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "sleep 5 && echo Deployed version: $(grep -m1 version /opt/iotistic/agent/package.json | tr -d ' ,') && echo Deployed build: $(grep -m1 '^BUILD_ID=' /etc/iotistic/agent.env | cut -d= -f2)"

      - name: Show license status and logs
        shell: cmd
        run: >
          "%PLINK%" %PLINK_ARGS%
          -pw "${{ secrets.PI_SSH_PASS }}"
          ${{ secrets.PI_SSH_USER }}@${{ secrets.PI_SSH_HOST }}
          "echo '--- License status ---'; sudo iotctl license; echo '--- License journal (last 10 minutes) ---'; sudo journalctl -u iotistica-agent --since '10 minutes ago' --no-pager | grep -i license || echo 'No licensing journal entries found'"
