[package]
name = "publish"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }
indexmap = "2"
itoa = "1"
ryu = "1"

zstd = "0.13"
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
opt-level = 3
